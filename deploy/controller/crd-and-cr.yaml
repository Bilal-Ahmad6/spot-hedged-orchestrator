apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hedgedservices.spothedge.io
spec:
  group: spothedge.io
  scope: Namespaced
  names:
    plural: hedgedservices
    singular: hedgedservice
    kind: HedgedService
    shortNames: [hs]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: spothedge.io/v1alpha1
kind: HedgedService
metadata:
  name: checkout-api
spec:
  target:
    deploymentOd: svc-od
    deploymentSpot: svc-spot
    service: checkout-api
  slo:
    p95LatencyMs: 150
    minAvailability: 0.999
  policy:
    tickSeconds: 60
    headroomH: 0.15
    lossFractionQ: 0.1667
    onDemandFloorFraction: 0.25
    diversityBeta: 0.65
    drainHeadroomVcpu: 8
    leadTimeSeconds: 90
    maxNodes: 120
    shapeVcpu: 4
