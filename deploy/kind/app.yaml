apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-od
  labels:
    app: checkout
    tier: on-demand
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
      tier: on-demand
  template:
    metadata:
      labels:
        app: checkout
        tier: on-demand
    spec:
      nodeSelector:
        spothedge.io/pool: on-demand
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: spothedge-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 200m
            limits:
              cpu: 500m
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-spot
  labels:
    app: checkout
    tier: spot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
      tier: spot
  template:
    metadata:
      labels:
        app: checkout
        tier: spot
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: spothedge.io/pool
                    operator: In
                    values: ["spot-a", "spot-b"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: spothedge.io/pool
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: checkout
              tier: spot
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: spothedge-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: 200m
            limits:
              cpu: 500m
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: checkout
