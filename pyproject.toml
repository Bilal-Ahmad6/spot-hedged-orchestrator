[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spothedge"
version = "0.1.0"
description = "Spot-hedged elastic orchestrator: reclaim-survival capacity policy for Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Amina Nauman" },
  { name = "Bilal Ahmad" },
  { name = "Mahnoor Amjad" },
  { name = "Rabia Ashfaq" },
]
dependencies = [
  "pulp>=3.2,<4",
  "PyYAML>=6.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "jsonschema>=4.23",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
k8s = ["kubernetes>=31", "kopf>=1.37"]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6.112"]

[project.scripts]
spothedge = "spothedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["spothedge"]
